<!doctype html>
<html lang="he" dir="rtl" data-theme="gold" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChessNest · שחמט</title>
<meta name="description" content="ChessNest — שחמט עם דמויות: מול המחשב (5 רמות), שניים בטלפון אחד, או אונליין עם חבר ודיבור. לוח קרב תלת-ממדי או לוח קלאסי.">
<meta name="theme-color" content="#0b0a10">
<meta property="og:title" content="ChessNest · שחמט">
<meta property="og:description" content="שחמט עם דמויות שנלחמות על הלוח — מול המחשב, בטלפון אחד או אונליין עם חבר.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------------- tokens: app theme (data-theme × data-mode) ---------------- */
:root{
  --bg:#0b0a10; --panel:#15131c; --panel2:#1d1a26; --line:#2e2a38; --ink:#f3efe4; --muted:#a29cae;
  --acc:#d4a940; --acc2:#f0cd6e; --accInk:#140f02; --ok:#46b46e; --bad:#e0584f;
  --scene1:#2a2140; --scene2:#07060b;
  --r:14px; --disp:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
[data-theme="silver"]{--acc:#c9ced6;--acc2:#eef1f5;--accInk:#0d0f12}
[data-theme="emerald"]{--acc:#3fbf7f;--acc2:#7fe0ae;--accInk:#03140b}
[data-theme="ruby"]{--acc:#e0566a;--acc2:#f598a6;--accInk:#1a0408}
[data-theme="ocean"]{--acc:#4aa8e8;--acc2:#97d0f6;--accInk:#03111c}
[data-mode="day"]{--bg:#f4f2ec;--panel:#ffffff;--panel2:#f0ede5;--line:#d9d3c4;--ink:#17150f;--muted:#6b6455;--scene1:#d9d2c0;--scene2:#a99f88}
[data-mode="day"][data-theme="gold"]{--acc:#a8801c;--acc2:#c99b2c;--accInk:#fff}
[data-mode="day"][data-theme="silver"]{--acc:#5c6573;--acc2:#7d8796;--accInk:#fff}
[data-mode="day"][data-theme="emerald"]{--acc:#1f8a55;--acc2:#2ea96b;--accInk:#fff}
[data-mode="day"][data-theme="ruby"]{--acc:#b8344a;--acc2:#d14d62;--accInk:#fff}
[data-mode="day"][data-theme="ocean"]{--acc:#1f6fa8;--acc2:#2f8acb;--accInk:#fff}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hide{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------------- screens ---------------- */
.scr{display:none;min-height:100vh;min-height:100dvh;animation:scrIn .22s ease;padding-top:env(safe-area-inset-top,0px)}
.scr.on{display:block}
@keyframes scrIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar h2{margin:0;font-family:var(--disp);font-weight:400;font-size:21px;flex:1}
.back{min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:22px;font-weight:700;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-weight:500;font-size:16px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn.main{background:var(--acc);color:var(--accInk);font-weight:700}
.btn.ghosty{border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default}
.btn:focus-visible,.back:focus-visible,.ibtn:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-family:var(--disp);font-weight:400;font-size:19px}
.muted{color:var(--muted);font-size:14px}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
input.in,select.in{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;min-height:46px;border:0;background:transparent;cursor:pointer;font-size:15px;padding:6px 4px;min-width:0}
.seg button.on{background:var(--acc);color:var(--accInk);font-weight:700}
.seg button:disabled{opacity:.35}
.sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw .t{flex:1}
.sw .t small{display:block;color:var(--muted);font-size:13px}
.tg{width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw.on .tg{background:var(--acc)}
.sw.on .tg::after{inset-inline-start:25px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.badge{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}

/* ---------------- home ---------------- */
.home{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.htop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.htop .tools{display:flex;gap:8px}
.ibtn{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:20px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.hlogo{font-family:var(--disp);font-size:26px;color:var(--acc2);text-shadow:0 2px 6px rgba(0,0,0,.4);flex:1;text-align:center;white-space:nowrap}
.hero{position:relative;margin:14px 0 16px;padding:18px 16px 0;border-radius:24px;background:radial-gradient(ellipse at 50% 110%,#4a3a1c,transparent 60%),radial-gradient(ellipse at 50% 0%,var(--scene1),var(--scene2) 85%);color:#f3efe4;overflow:hidden;border:1px solid var(--line);min-height:200px}
.hero h1{margin:0;font-family:var(--disp);font-weight:400;font-size:38px;line-height:1.05;position:relative}
.hero h1 small{display:block;font-size:19px;opacity:.85;margin-top:4px}
.hero p{margin:8px 0 0;opacity:.92;font-size:15px;position:relative}
.hero .army{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:6px -8px -4px;pointer-events:none;direction:ltr}
.hero .army img{width:15%;max-width:64px;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));animation:bob 3s ease-in-out infinite}
.hero .army img:nth-child(2n){animation-delay:-1.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:14px;min-height:70px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--acc);background:transparent;cursor:pointer;text-align:start;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.mode .ic{font-size:28px;width:40px;text-align:center}
.mode b{display:block;font-size:18px}
.mode span{font-size:13px;color:var(--muted)}
.mode.main{background:var(--acc);color:var(--accInk)}
.mode.main span{color:inherit;opacity:.8}
.minor{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.minor button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.minor button i{font-style:normal;font-size:22px}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvb{flex-direction:column;gap:2px;padding:8px 2px;min-height:64px;font-size:12px;line-height:1.15}
.lvb i{font-style:normal;font-size:24px}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.setb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;min-height:96px}
.setb.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.setb .pv{display:flex;align-items:flex-end;height:58px;direction:ltr}
.setb .pv img{height:58px;width:auto}
.setb .pv img.cl{height:40px}
.setb span{font-size:13px}

/* ---------------- game ---------------- */
#game{background:radial-gradient(ellipse at 50% 30%,var(--scene1),var(--scene2) 80%);color:#f3efe4;padding-top:0}
[data-mode="day"] #game{color:#1b1710}
#game.on{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gtop{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(0,0,0,.28);flex:none}
.gtop .back{height:40px;min-width:44px;border-color:currentColor;color:inherit}
.gtop .ttl{flex:1;min-width:0;font-size:13px;line-height:1.2;opacity:.9}
.gtop .ttl b{font-family:var(--disp);font-weight:400;font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtop .ibtn{width:40px;height:40px;background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.15);color:inherit}
.net{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.35);white-space:nowrap}
.net.bad{background:#a8322a;color:#fff}
.pbar{display:flex;align-items:center;gap:8px;padding:4px 10px;min-height:44px;flex:none}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.pbar .who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .who b .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#46d07a;margin-inline-end:5px;vertical-align:middle}
.pbar .who b .dot.off{background:#888}
.pbar .cap{display:flex;align-items:center;min-height:18px;direction:ltr;justify-content:flex-start;font-size:12px;gap:0;opacity:.95}
[dir="rtl"] .pbar .cap{justify-content:flex-end}
.pbar .cap img{width:17px;height:17px;margin-inline-end:-4px}
.pbar .cap em{font-style:normal;margin-inline-start:7px;font-weight:700;color:var(--acc2)}
.pbar .tm{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.6)}
.pbar .tm.w{background:#f4f0e4}.pbar .tm.b{background:#1b1820}
.pbar.turn .who b{color:var(--acc2)}
.pbar .clk{font-family:var(--disp);font-size:22px;min-width:84px;text-align:center;padding:2px 10px;border-radius:10px;background:rgba(0,0,0,.4);direction:ltr;font-variant-numeric:tabular-nums;color:#f3efe4}
.pbar .clk.run{background:var(--acc);color:var(--accInk)}
.pbar .clk.low{background:#c0392b;color:#fff;animation:hintP 1s ease-in-out infinite}
.pbar .av{font-size:24px;width:30px;text-align:center;flex:none}
#stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none}
.bstage{position:absolute;inset:0}
.bsvg{position:absolute;left:0;top:0;overflow:visible}
.bpcs,.bfx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.bpcs img,.bfx img{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.bpcs img.sel{filter:drop-shadow(0 0 4px var(--acc2)) drop-shadow(0 0 10px var(--acc2)) brightness(1.08);transform:translateY(-5%)}
.bpcs img.chk{filter:drop-shadow(0 0 5px #ff3b3b) drop-shadow(0 0 12px #ff3b3b)}
.bpcs img.hintp{animation:hintP 1s ease-in-out 3}
.bpcs img.fallen{transform:rotate(78deg);transform-origin:50% 95%;filter:grayscale(.75) brightness(.7);transition:transform 1.1s cubic-bezier(.55,0,.8,.6),filter 1.1s}
.dragGhost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-78%) scale(1.15);filter:drop-shadow(0 12px 14px rgba(0,0,0,.55));opacity:.95}
.bpcs img.dragFrom{opacity:.35}
.coordt{font:600 11px var(--body);fill:rgba(255,255,255,.7)}
.mstrip{flex:none;height:28px;display:flex;align-items:center;gap:10px;padding:0 10px;overflow-x:auto;white-space:nowrap;direction:ltr;font-size:14px;scrollbar-width:none;cursor:pointer}
.mstrip::-webkit-scrollbar{display:none}
.mstrip span{opacity:.75}.mstrip span.last{opacity:1;color:var(--acc2);font-weight:700}
.mstrip i{font-style:normal;opacity:.5;margin-inline-end:3px}
.msg{min-height:22px;text-align:center;font-size:14px;padding:0 8px;font-weight:500;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.abar{display:flex;gap:8px;padding:6px 10px 8px;flex:none;background:rgba(0,0,0,.22)}
.abar .btn{flex:1;min-height:52px;padding:4px 6px;font-size:15px;line-height:1.15;color:inherit;border-color:rgba(255,255,255,.22);flex-direction:column;gap:0}
.abar .btn i{font-style:normal;font-size:19px}
.abar .btn small{font-size:11px;opacity:.85;font-weight:400}
.abar .btn.main{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.voice{display:flex;gap:8px;padding:0 10px 8px;flex:none;background:rgba(0,0,0,.22)}
.voice .btn{flex:1;min-height:44px;color:inherit;border-color:rgba(255,255,255,.22);font-size:15px;padding:4px 6px}
.voice .btn.on{background:#2e8b57;border-color:#2e8b57;color:#fff}
.voice .btn.rec.on{background:#c0392b;border-color:#c0392b}
.ptt{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cn-banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:46;pointer-events:none;text-align:center;white-space:nowrap;padding:12px 26px;border-radius:20px;background:rgba(8,8,8,.88);border:2px solid var(--acc);box-shadow:0 0 28px color-mix(in srgb,var(--acc) 45%,transparent);animation:bannerIn 2.4s cubic-bezier(.2,.9,.3,1.2) forwards;max-width:94vw}
.cn-banner b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(34px,12vw,60px);line-height:1;color:var(--acc2)}
.cn-banner span{display:block;margin-top:6px;color:#f3efe4;font-size:14px;font-weight:500;white-space:normal}
.cn-banner.chk{padding:6px 18px;top:50%;animation-duration:1.2s;border-color:#e74c3c}.cn-banner.chk b{font-size:clamp(26px,9vw,40px);color:#ff7b6b}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}22%{transform:translate(-50%,-50%) scale(1)}84%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.confetti{position:absolute;top:-12px;width:9px;height:14px;z-index:45;pointer-events:none;border-radius:2px}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes hintP{0%,100%{transform:none}50%{transform:scale(1.07)}}

/* ---------------- overlays ---------------- */
#ovs .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#ovs .box{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:16px;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
#ovs .ov.center{align-items:center}
.ov h3{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:24px}
.res .big{font-family:var(--disp);font-size:32px;text-align:center;margin:4px 0 4px;color:var(--acc)}
.res .why{text-align:center;color:var(--muted);margin-bottom:10px}
.res .art{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:110px;margin-bottom:6px}
.res .art img{height:100px;width:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));animation:winPop .7s cubic-bezier(.2,.9,.3,1.3) both}
.res .art img.fallen{transform:rotate(80deg) translate(30%,10%);filter:grayscale(.6) drop-shadow(0 6px 8px rgba(0,0,0,.4));animation:none;height:70px}
@keyframes winPop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.tbl th{font-weight:500;color:var(--muted)}
.tbl td:first-child{text-align:start}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.promo button{border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px;font-size:13px}
.promo img{height:72px;width:auto}
.promo img.cl{height:52px}
.mlist{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 10px;direction:ltr;font-size:15px;max-height:50vh;overflow:auto}
.mlist i{font-style:normal;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--panel);color:var(--ink);border:1px solid var(--acc);padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw;text-align:center;font-size:15px}
#toast.on{opacity:1;transform:translateX(-50%)}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:40}
.bub{position:absolute;max-width:70vw;background:#fff;color:#111;padding:8px 12px;border-radius:16px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:bubIn .25s ease}
.bub small{display:block;font-size:11px;color:#666}
.bub.emo{background:transparent;box-shadow:none;font-size:46px;padding:0;animation:pop 1.2s ease}
@keyframes bubIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}30%{transform:scale(1.25)}60%{transform:scale(1)}100%{transform:translateY(-14px)}}
.emogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.emogrid button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:24px;cursor:pointer}
.phr{display:grid;gap:8px;margin-top:10px}
.phr button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:15px}
.vmsg{display:flex;align-items:center;gap:8px}
.code{font-family:var(--disp);font-size:44px;letter-spacing:.12em;text-align:center;direction:ltr}
.roster{display:grid;gap:6px;margin:10px 0}
.roster div{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--panel2)}
.rules h3{font-family:var(--disp);font-weight:400;margin:18px 0 6px}
.rules p,.rules li{font-size:15px}
.rules .rimg{display:flex;justify-content:center;gap:4px;margin:6px 0;direction:ltr}
.rules .rimg img{height:56px;width:auto}
.tut{text-align:center}
.tut .big{font-size:60px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.rp{position:relative;height:min(58vh,420px);border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,var(--scene1),var(--scene2) 80%)}
@media (max-width:370px){.abar .btn{font-size:14px}.pbar .clk{font-size:19px;min-width:72px}}

<script>
/* ---- nestlink.js ---- */
/* =====================================================================
   NestLink 1.1 — AppNest online multiplayer module (WebRTC via PeerJS)
   One file, drop into any AppNest game. No server of our own:
   - a public PeerJS server only introduces the phones; game data, voice
     and voice messages then travel directly phone-to-phone.
   - star layout: the host is seat 0 and relays messages between guests,
     so 2–6 players work; voice is a direct mesh (good up to ~4–5).
   - every game message is sequenced and re-sent after a reconnect.
   The game owns the session object (persist it with the game state) and
   receives events through callbacks. See NESTLINK.md for the API.
   1.1: sendTo(seat, d) — a private message to one seat only (card games:
        the host deals each player only their own cards). Compatible with 1.0.
        Heartbeat: a phone that vanished (app closed, no signal) is marked offline
        within ~10 s instead of looking connected forever.
        After a reconnect, if the other side already got more messages than we
        remember sending (we restored an older saved session), numbering continues
        after theirs instead of being silently ignored.
   ===================================================================== */
const NestLink = (() => {
  const CDNS = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'];
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  const AB = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const genCode = (n = 5) => Array.from({ length: n }, () => AB[Math.floor(Math.random() * AB.length)]).join('');
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function loadScript(u) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); }); }
  async function loadPeer() { if (window.Peer) return true; for (const u of CDNS) { try { await loadScript(u); if (window.Peer) return true; } catch (e) {} } return false; }
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

  function create(opt) {
    const L = { status: 'off', lastErr: null, peer: null, conns: {}, retry: null, chunks: {}, calls: {}, audio: {}, mic: null, talking: false, openMic: false, rec: null, seen: {}, hb: {}, hbT: null };
    let S = null;                                         // the session — owned and persisted by the game
    const ev = (k, ...a) => { try { opt[k] && opt[k](...a); } catch (e) { console.error(e); } };
    const persist = () => ev('persist', S);
    const roomId = c => (opt.app || 'nest') + '-v1-' + c.toLowerCase();
    const max = () => opt.maxPlayers || 2;
    const isHost = () => S && S.role === 'host';
    function peerOpts() {
      const q = new URLSearchParams(location.search), o = { debug: 0, config: { iceServers: opt.iceServers || ICE } };
      if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = '/'; o.secure = false; }   // test servers only
      return o;
    }
    function setStatus(st, err) { L.status = st; if (err !== undefined) L.lastErr = err; ev('onStatus', st, L.lastErr); }
    const link = seat => S.links[seat] || (S.links[seat] = { seq: 0, lastIn: 0, out: [] });
    const rosterEntry = seat => S.roster.find(p => p.seat === seat);
    function rawTo(seat, m) { const c = L.conns[seat]; try { if (c && c.open) c.send(m); } catch (e) {} }
    function rawAll(m, except) { for (const s in L.conns) if (+s !== except) rawTo(+s, m); }

    /* ---------- starting ---------- */
    async function start(session) {
      close(true); S = session; persist();
      L.hbT = setInterval(beat, 3000);                   // after close(), which clears it
      setStatus('connecting');
      if (!(await loadPeer())) { setStatus('error', 'load'); return false; }
      const peer = L.peer = new Peer(isHost() ? roomId(S.code) : undefined, peerOpts());
      peer.on('open', id => {
        S.pid = id; if (isHost()) { const me = rosterEntry(0); if (me) { me.pid = id; me.online = true; } }
        persist(); setStatus(isHost() ? 'waiting' : 'connecting'); if (!isHost()) connectHost();
      });
      peer.on('connection', c => { if (isHost()) attach(c, null); });
      peer.on('call', onCall);
      peer.on('disconnected', () => setTimeout(() => { try { if (L.peer === peer && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500));
      peer.on('error', e => {
        const t = e && e.type;
        if (t === 'unavailable-id') {                     // room id still held (e.g. after reload) — new code while nobody joined, else retry
          if (S.roster.length < 2) { S.code = genCode(); persist(); ev('onCode', S.code); }
          setTimeout(() => start(S), S.roster.length < 2 ? 300 : 4000); return;
        }
        if (t === 'peer-unavailable') { setStatus('notfound', 'nf'); scheduleRetry(); return; }
        if (/network|server-error|socket/.test(t || '')) setStatus('error', 'net');
      });
      return true;
    }
    function host(code) {
      return start({ role: 'host', code: code || genCode(), seat: 0, cid: uid(), roster: [{ seat: 0, name: opt.name ? opt.name() : '', online: true, cid: null, voice: false }], links: {} });
    }
    function join(code) { return start({ role: 'guest', code: code.toUpperCase(), seat: null, cid: uid(), roster: [], links: {} }); }
    function resume(session) { return start(session); }
    function scheduleRetry() { clearTimeout(L.retry); if (S && !isHost() && !(L.conns[0] && L.conns[0].open)) L.retry = setTimeout(connectHost, 3000); }
    function connectHost() { if (!L.peer || L.peer.destroyed || (L.conns[0] && L.conns[0].open)) return; attach(L.peer.connect(roomId(S.code), { reliable: true, serialization: 'json' }), 0); scheduleRetry(); }

    /* ---------- connections ---------- */
    function attach(c, seat) {
      let mySeat = seat;                                  // the seat at the other end of this connection
      const onOpen = () => {
        if (!isHost()) { L.conns[0] = c; rawTo(0, { t: 'hi', cid: S.cid, name: opt.name ? opt.name() : '', have: link(0).lastIn, v: opt.version, hb: 1 }); }
      };
      if (c.open) onOpen(); else c.on('open', onOpen);
      c.on('data', m => {
        if (!m || !m.t) return;
        const key = isHost() ? mySeat : 0;                // 1.1 heartbeat: remember when we last heard from them
        if (key != null) L.seen[key] = Date.now();
        if (m.t === 'ping') { if (key != null) L.hb[key] = 1; return; }
        if (isHost() && m.t === 'hi') {                   // a guest introduces itself → give it a seat (same seat when it comes back)
          let p = S.roster.find(x => x.cid === m.cid);
          if (!p) {
            if (S.roster.length >= max()) { try { c.send({ t: 'full' }); c.close(); } catch (e) {} return; }
            let s = 1; while (S.roster.some(x => x.seat === s)) s++;
            p = { seat: s, cid: m.cid, name: '', online: true, voice: false }; S.roster.push(p); S.roster.sort((a, b) => a.seat - b.seat);
            ev('onJoin', s);
          }
          mySeat = p.seat; p.name = (m.name || '').slice(0, 20); p.online = true; p.pid = c.peer;
          if ((m.have || 0) > link(mySeat).seq) link(mySeat).seq = m.have;   // 1.1: we restored an older session — keep numbering after what they already got
          if (L.conns[mySeat] && L.conns[mySeat] !== c) { try { L.conns[mySeat].close(); } catch (e) {} }
          L.conns[mySeat] = c; L.seen[mySeat] = Date.now(); L.hb[mySeat] = m.hb ? 1 : 0;   // 1.1 phones announce the heartbeat
          rawTo(mySeat, { t: 'hi', seat: mySeat, have: link(mySeat).lastIn, roster: S.roster, v: opt.version, hb: 1 });
          link(mySeat).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(mySeat, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          persist(); broadcastRoster(); setStatus('open'); callEveryone();
          return;
        }
        if (!isHost() && m.t === 'hi') {
          S.seat = m.seat; S.roster = m.roster || []; L.seen[0] = Date.now(); L.hb[0] = m.hb ? 1 : 0;
          if ((m.have || 0) > link(0).seq) link(0).seq = m.have;            // 1.1: same protection on the guest side
          persist();
          link(0).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(0, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          clearTimeout(L.retry); setStatus('open'); ev('onRoster', S.roster); callEveryone(); return;
        }
        if (m.t === 'full') { setStatus('full', 'full'); close(true); return; }
        onData(m, isHost() ? mySeat : 0);
      });
      const gone = () => {
        if (isHost()) { if (mySeat == null || L.conns[mySeat] !== c) return; delete L.conns[mySeat]; const p = rosterEntry(mySeat); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { if (L.conns[0] !== c) return; delete L.conns[0]; setStatus('reconnecting'); scheduleRetry(); }
        stopAudioFrom(mySeat);
      };
      c.on('close', gone); c.on('error', gone);
    }
    function broadcastRoster() { if (!isHost()) return; rawAll({ t: 'roster', roster: S.roster }); ev('onRoster', S.roster); }

    /* ---------- messages ---------- */
    function onData(m, via) {
      if (m.t === 'roster') { S.roster = m.roster; persist(); ev('onRoster', S.roster); callEveryone(); return; }
      if (m.t === 'need') { link(via).out.filter(x => x.seq > m.have).forEach(x => rawTo(via, x)); return; }
      if (m.t === 'emo' || m.t === 'talk' || m.t === 'vm') {
        if (isHost()) rawAll(m, via);                     // relay to the other guests
        if (m.t === 'emo') ev('onEmoji', m.e, m.from);
        else if (m.t === 'talk') { const p = rosterEntry(m.from); if (p) p.talking = m.on; ev('onTalk', m.from, m.on); }
        else gotChunk(m);
        return;
      }
      if (m.t === 'voice') { const p = rosterEntry(m.from); if (p) p.voice = m.on; if (isHost()) { rawAll(m, via); broadcastRoster(); } callEveryone(); return; }
      if (m.t !== 'm') return;
      const lk = link(via);
      if (m.seq <= lk.lastIn) return;
      if (m.seq > lk.lastIn + 1) { rawTo(via, { t: 'need', have: lk.lastIn }); return; }
      lk.lastIn = m.seq; persist();
      if (isHost() && max() > 2 && !m.p) for (const p of S.roster) if (p.seat !== 0 && p.seat !== m.from) seqTo(p.seat, m.d, m.from);
      ev('onMessage', m.d, m.from);
    }
    function seqTo(seat, d, from, priv) {
      const lk = link(seat), m = { t: 'm', seq: ++lk.seq, from, d }; if (priv) m.p = 1;
      lk.out.push(m); if (lk.out.length > 300) lk.out.splice(0, lk.out.length - 300);
      rawTo(seat, m);
    }
    function send(d) {                                    // reliable, ordered, reaches every other player
      if (!S) return;
      if (isHost()) { for (const p of S.roster) if (p.seat !== 0) seqTo(p.seat, d, 0); }
      else seqTo(0, d, S.seat);
      persist();
    }
    function sendTo(seat, d) {                            // private: host → one guest, or guest → host only (not relayed)
      if (!S || seat === S.seat) return;
      if (isHost()) { if (S.roster.some(p => p.seat === seat)) seqTo(seat, d, 0, true); }
      else seqTo(0, d, S.seat, true);
      persist();
    }
    function emoji(e) { if (S) rawAll({ t: 'emo', e, from: S.seat }); }
    const isOpen = () => !!S && (isHost() ? Object.values(L.conns).some(c => c.open) : !!(L.conns[0] && L.conns[0].open));

    /* ---------- voice: push-to-talk / open mic (direct mesh) ---------- */
    async function micOn() {
      if (L.mic) return true;
      try { L.mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
      catch (e) { ev('onMicError', e && e.name); return false; }
      L.mic.getAudioTracks().forEach(t => t.enabled = L.openMic);
      const me = rosterEntry(S.seat); if (me) me.voice = true;
      const m = { t: 'voice', on: true, from: S.seat }; rawAll(m);
      callEveryone(); return true;
    }
    function callEveryone() {                             // each phone with a mic sends its own one-way audio call to every other phone
      if (!L.mic || !L.peer || !S) return;
      for (const p of S.roster) {
        if (p.seat === S.seat || !p.online || !p.pid) continue;
        const c = L.calls[p.seat]; if (c && !c._dead) continue;
        try { const call = L.peer.call(p.pid, L.mic, { metadata: { seat: S.seat } }); L.calls[p.seat] = call; call.on('close', () => { call._dead = true; }); call.on('error', () => { call._dead = true; }); } catch (e) {}
      }
    }
    function onCall(call) {
      call.answer();                                      // receive only — our own audio goes out on our own call
      call.on('stream', st => {
        const seat = call.metadata && call.metadata.seat;
        let a = L.audio[seat]; if (!a) { a = L.audio[seat] = document.createElement('audio'); a.autoplay = true; a.setAttribute('playsinline', ''); a.style.display = 'none'; document.body.appendChild(a); }
        a.srcObject = st; const p = a.play(); if (p && p.catch) p.catch(() => ev('onAudioBlocked'));
      });
    }
    function stopAudioFrom(seat) { const a = L.audio[seat]; if (a) { a.srcObject = null; a.remove(); delete L.audio[seat]; } const c = L.calls[seat]; if (c) { try { c.close(); } catch (e) {} delete L.calls[seat]; } }
    async function talk(on) {
      if (on && !(await micOn())) return false;
      if (!L.mic) return false;
      L.talking = on || L.openMic; L.mic.getAudioTracks().forEach(t => t.enabled = L.talking);
      rawAll({ t: 'talk', on: L.talking, from: S.seat }); return true;
    }
    async function setOpenMic(on) { L.openMic = on; if (on && !(await micOn())) { L.openMic = false; return false; } return talk(on); }

    /* ---------- voice messages ---------- */
    async function recStart(maxSec) {
      if (L.rec || !(await micOn())) return false;
      const track = L.mic.getAudioTracks()[0].clone(); track.enabled = true;
      const st = new MediaStream([track]), mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
      let r; try { r = new MediaRecorder(st, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : undefined); } catch (e) { ev('onMicError', 'rec'); return false; }
      const parts = [], t0 = Date.now();
      L.rec = { r, track, t0, timer: setTimeout(() => recStop(), (maxSec || 20) * 1000) };
      r.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
      r.onstop = async () => {
        track.stop();
        const dur = Math.round((Date.now() - t0) / 100) / 10, blob = new Blob(parts, { type: r.mimeType || mime || 'audio/webm' });
        if (L.rec && L.rec.cancel || dur < .4 || !blob.size) { L.rec = null; ev('onRecState', false); return; }
        L.rec = null; ev('onRecState', false);
        const data = b64(await blob.arrayBuffer()), id = uid(), CH = 12000, n = Math.ceil(data.length / CH);
        for (let i = 0; i < n; i++) rawAll({ t: 'vm', id, i, n, dur, mime: blob.type, from: S.seat, data: data.slice(i * CH, (i + 1) * CH) });
        ev('onVoiceMsg', URL.createObjectURL(blob), dur, S.seat, true);
      };
      r.start(); ev('onRecState', true, t0); return true;
    }
    function recStop(cancel) { if (!L.rec) return; clearTimeout(L.rec.timer); L.rec.cancel = !!cancel; try { L.rec.r.stop(); } catch (e) {} }
    function gotChunk(m) {
      const c = L.chunks[m.id] || (L.chunks[m.id] = { parts: [], got: 0, t: Date.now() });
      if (c.parts[m.i] == null) { c.parts[m.i] = m.data; c.got++; }
      if (c.got === m.n) { delete L.chunks[m.id]; const blob = new Blob([unb64(c.parts.join(''))], { type: m.mime || 'audio/webm' }); ev('onVoiceMsg', URL.createObjectURL(blob), m.dur, m.from, false); }
      for (const k in L.chunks) if (Date.now() - L.chunks[k].t > 60000) delete L.chunks[k];
    }

    /* ---------- 1.1 heartbeat ----------
       A phone that closes the app or loses signal often never fires 'close'. Every 3 s we ping
       everyone; a peer that pings (1.1+) but has been silent for 10 s is treated as gone.
       Peers on 1.0 never ping, so they are never dropped by mistake. */
    function beat() {
      if (!S) return;
      const now = Date.now();
      for (const k in L.conns) {
        const s = +k; rawTo(s, { t: 'ping' });
        if (!L.hb[s] || now - (L.seen[s] || now) < 10000) continue;
        L.hb[s] = 0; const c = L.conns[s]; delete L.conns[s]; try { c.close(); } catch (e) {}
        stopAudioFrom(s);
        if (isHost()) { const p = rosterEntry(s); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { setStatus('reconnecting'); scheduleRetry(); }
      }
    }

    /* ---------- closing ---------- */
    function close(keepSession) {
      clearTimeout(L.retry); clearInterval(L.hbT); L.hbT = null;
      Object.keys(L.audio).forEach(s => stopAudioFrom(+s));
      for (const s in L.conns) { try { L.conns[s].close(); } catch (e) {} }
      L.conns = {};
      if (L.mic) { L.mic.getTracks().forEach(t => t.stop()); L.mic = null; }
      L.calls = {}; L.talking = false;
      try { if (L.peer) L.peer.destroy(); } catch (e) {}

/* ---------- error log (shown in the about/diagnostics card) ---------- */
const ERRS = LS.get('errs', []);
function logErr(m) { ERRS.unshift({ m: String(m).slice(0, 200), t: new Date().toISOString() }); ERRS.length = Math.min(ERRS.length, 10); LS.set('errs', ERRS); }
window.addEventListener('error', e => logErr((e.message || 'error') + ' @' + (e.lineno || '')));
window.addEventListener('unhandledrejection', e => logErr('promise: ' + (e.reason && e.reason.message || e.reason)));

/* ---------- backup / restore ---------- */
function backup() {
  const data = { app: 'ChessNest', v: APP_VERSION, user: ST.name, date: new Date().toISOString(), data: {} };
  LS.keys().forEach(k => { if (k !== 'errs') data.data[k] = LS.get(k); });
  if (data.data.game && data.data.game.mode === 'online') delete data.data.game;     // a live online session can't be restored elsewhere
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'chessnest-backup-' + (ST.name ? ST.name.replace(/[^\w֐-׿-]+/g, '_') + '-' : '') + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(T('backupDone'));
}
function restore(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!d || d.app !== 'ChessNest' || !d.data) throw new Error('bad');
      confirmBox(T('restoreQ'), T('restore'), () => { LS.keys().forEach(k => LS.del(k)); Object.keys(d.data).forEach(k => LS.set(k, d.data[k])); location.reload(); });
    } catch (e) { toast(T('restoreBad')); }
  };
  r.readAsText(file);
}

rulesB:"<h3>How each piece moves</h3><ul><li><b>King</b> — one square in any direction. It may never stand on an attacked square.</li><li><b>Queen</b> — any number of squares in a straight line or diagonally.</li><li><b>Rook</b> — any number of squares in a straight line.</li><li><b>Bishop</b> — any number of squares diagonally (it always stays on one colour).</li><li><b>Knight</b> — in an \"L\": two one way and one to the side. The only piece that jumps over others.</li><li><b>Pawn</b> — one square forward (two on its first move), and captures diagonally forward.</li></ul><p>You capture an enemy piece by moving onto its square. Pieces can't pass through others (except the knight).</p>",
rulesC:"<h3>Special moves</h3><ul><li><b>Castling</b> — the king moves two squares towards a rook, and the rook jumps over it. Allowed only if neither has moved, nothing stands between them, and the king is not in check and doesn't pass through an attacked square. In the app: move the king two squares.</li><li><b>En passant</b> — a pawn that moved two squares and landed next to your pawn can be captured diagonally on your very next move, as if it had moved only one.</li><li><b>Promotion</b> — a pawn that reaches the last row becomes a queen, rook, bishop or knight (your choice).</li></ul>",
rulesD:"<h3>The end of the game</h3><ul><li><b>Check</b> — the king is attacked. You must save it: move away, block or capture the attacker.</li><li><b>Checkmate</b> — a check with no way out. Whoever gives mate wins.</li><li><b>Stalemate</b> — no check, but no legal move either. It's a draw!</li><li><b>Draw</b> — also when the same position appears 3 times, after 50 moves without a capture or pawn move, when there aren't enough pieces to mate, or by agreement.</li><li><b>Clock</b> — if your time runs out, you lose (unless your opponent can't possibly mate — then it's a draw).</li></ul>",

rulesA:"<h3>Цель</h3><p>Поставить <b>мат</b> королю соперника: атаковать его так, чтобы ему некуда было уйти. Белые всегда начинают, ходят по очереди — по одному ходу.</p><h3>Фигуры</h3><p>Король, ферзь, ладья, слон, конь и пешка. У каждой стороны 16 фигур.</p>",
rulesB:"<h3>Как ходят фигуры</h3><ul><li><b>Король</b> — на одно поле в любую сторону. Нельзя вставать на атакованное поле.</li><li><b>Ферзь</b> — на любое число полей по прямой или по диагонали.</li><li><b>Ладья</b> — на любое число полей по прямой.</li><li><b>Слон</b> — на любое число полей по диагонали (всегда на полях одного цвета).</li><li><b>Конь</b> — буквой «Г»: два поля в одну сторону и одно вбок. Единственная фигура, которая перепрыгивает через другие.</li><li><b>Пешка</b> — на одно поле вперёд (первым ходом можно на два), бьёт по диагонали вперёд.</li></ul><p>Фигура соперника берётся, когда вы встаёте на её поле. Через фигуры проходить нельзя (кроме коня).</p>",
rulesC:"<h3>Особые ходы</h3><ul><li><b>Рокировка</b> — король ходит на два поля к ладье, а ладья перепрыгивает через него. Можно, только если ни король, ни ладья ещё не ходили, между ними нет фигур, король не под шахом и не проходит через атакованное поле. В приложении: передвиньте короля на два поля.</li><li><b>Взятие на проходе</b> — пешку, которая сделала ход на два поля и встала рядом с вашей, можно сразу же взять по диагонали, как будто она сходила на одно.</li><li><b>Превращение</b> — пешка, дошедшая до последней горизонтали, становится ферзём, ладьёй, слоном или конём (на выбор).</li></ul>",
rulesD:"<h3>Конец партии</h3><ul><li><b>Шах</b> — король атакован. Его нужно спасти: уйти, закрыться или взять атакующую фигуру.</li><li><b>Мат</b> — шах, от которого нет защиты. Кто поставил мат — победил.</li><li><b>Пат</b> — шаха нет, но и допустимых ходов нет. Это ничья!</li><li><b>Ничья</b> — также при трёхкратном повторении позиции, после 50 ходов без взятий и ходов пешкой, когда не хватает фигур для мата, или по согласию.</li><li><b>Часы</b> — у кого закончилось время, тот проиграл (если только сопернику хватает фигур для мата — иначе ничья).</li></ul>",
rulesE:"<h3>В приложении</h3><ul><li>Нажмите на фигуру, затем на поле — или перетащите её. Точка = туда можно пойти, красная рамка = взятие.</li><li>Крупные пальцы? Нажатие <b>рядом</b> с целью тоже засчитывается, а промах не отменяет выбор.</li><li>🎥 переключает боевую доску (3D) и классическую. В ⋯ выбираются персонажи, доска и бои.</li><li>Против компьютера: ↶ отменяет ход, 💡 даёт подсказку. Всё учитывается на экране итогов.</li><li>Онлайн: отмена хода и ничья отправляются другу на подтверждение. Подсказок нет — честная игра.</li></ul>",

rulesA:"<h3>El objetivo</h3><p>Dar <b>jaque mate</b> al rey rival: atacarlo de forma que no pueda escapar. Siempre empiezan las blancas, y se juega por turnos — una jugada cada uno.</p><h3>Las piezas</h3><p>Rey, dama, torre, alfil, caballo y peón. Cada bando tiene 16 piezas.</p>",
rulesB:"<h3>Cómo se mueve cada pieza</h3><ul><li><b>Rey</b> — una casilla en cualquier dirección. Nunca puede quedar en una casilla atacada.</li><li><b>Dama</b> — las casillas que quiera, en línea recta o en diagonal.</li><li><b>Torre</b> — las casillas que quiera, en línea recta.</li><li><b>Alfil</b> — las casillas que quiera, en diagonal (siempre en el mismo color).</li><li><b>Caballo</b> — en forma de \"L\": dos hacia un lado y una de costado. Es la única pieza que salta sobre otras.</li><li><b>Peón</b> — una casilla hacia adelante (dos en su primera jugada) y captura en diagonal hacia adelante.</li></ul><p>Se captura una pieza rival al ocupar su casilla. No se puede atravesar otras piezas (salvo el caballo).</p>",
rulesC:"<h3>Jugadas especiales</h3><ul><li><b>Enroque</b> — el rey se mueve dos casillas hacia una torre y la torre salta por encima. Solo si ninguno se ha movido, no hay piezas entre ellos, y el rey no está en jaque ni pasa por una casilla atacada. En la app: mueve el rey dos casillas.</li><li><b>Captura al paso</b> — un peón que avanzó dos casillas y quedó junto al tuyo puede ser capturado en diagonal en tu jugada siguiente, como si hubiera avanzado una.</li><li><b>Coronación</b> — un peón que llega a la última fila se convierte en dama, torre, alfil o caballo (a elección).</li></ul>",
rulesD:"<h3>El final de la partida</h3><ul><li><b>Jaque</b> — el rey está atacado. Hay que salvarlo: moverlo, tapar o capturar al atacante.</li><li><b>Jaque mate</b> — un jaque sin salida. Quien da mate gana.</li><li><b>Ahogado</b> — no hay jaque, pero tampoco jugadas legales. ¡Son tablas!</li><li><b>Tablas</b> — también cuando la misma posición aparece 3 veces, tras 50 jugadas sin capturas ni movimientos de peón, cuando no quedan piezas para dar mate, o de mutuo acuerdo.</li><li><b>Reloj</b> — si se te acaba el tiempo, pierdes (salvo que el rival no pueda dar mate — entonces son tablas).</li></ul>",
rulesE:"<h3>En la app</h3><ul><li>Toca una pieza y luego la casilla — o arrástrala. Un punto = puedes ir allí, un marco rojo = captura.</li><li>¿Dedos grandes? Tocar <b>cerca</b> del destino también cuenta, y fallar por poco no cancela tu selección.</li><li>🎥 cambia entre el tablero de batalla (3D) y el clásico. En ⋯ eliges personajes, tablero y batallas.</li><li>Contra la computadora: ↶ deshace una jugada, 💡 da una pista. Todo se cuenta en la pantalla final.</li><li>Online: deshacer y tablas se envían a tu amigo para que acepte. Sin pistas — juego limpio.</li></ul>",

/* ---- game.js ---- */
/* =====================================================================

const LVL_IC = ['', '🐣', '🙂', '🎓', '🧠', '👑'];

/* ---------- starting ---------- */
function newSession(mode, extra) {
  clearTimers(); THINK = null; SEL = -1; HINT = null;
  G = Object.assign({ v: 1, id: Date.now(), mode, fen0: CE.START, moves: [], sans: [], result: null, why: '', names: ['', ''], clock: null, undos: [0, 0], hints: 0, counted: false, started: true }, extra || {});

function startCpu(lvl, color, clockKey) {

  const me = ST.name || T('you'), cpu = LVL_IC[lvl] + ' ' + T('cpuName', T('lv' + lvl));
  newSession('cpu', { lvl, human, names: human ? [cpu, me] : [me, cpu], clock: clockOf(clockKey) });

/* ---------- moves ---------- */

/* ---------- replays (start + moves → the engine rebuilds every step) ---------- */
function playReplay(r) {
  let frames;
  try { const p = CE.fromFEN(r.fen0); frames = [{ pos: CE.clone(p), last: null, san: '' }]; for (const u of r.moves) { const m = CE.fromUci(p, u); if (!m) throw new Error('bad'); const san = CE.san(p, m); CE.make(p, m); frames.push({ pos: CE.clone(p), last: { from: CE.mFrom(m), to: CE.mTo(m) }, san }); } }
  catch (e) { toast(T('replayBad')); return; }
  let i = 0, auto = null; const pv = r.me >= 0 ? r.me : 0;
  const o = overlay('<h3>' + esc(T('replay')) + ' · ' + esc(r.names[0] + ' — ' + r.names[1]) + '</h3><div class="rp" id="rpB"></div><div class="msg" id="rpM" style="margin-top:6px"></div><div class="row" dir="ltr" style="margin-top:6px"><button class="btn" data-k="0">⏮</button><button class="btn" data-k="-1">◀</button><button class="btn main" data-k="p">▶</button><button class="btn" data-k="1">▶|</button><button class="btn" data-k="9">⏭</button></div><div class="row" style="margin-top:8px"><button class="btn ghosty" data-k="x">' + esc(T('close')) + '</button></div>', 'center');
  const RB = new ChessBoard($('#rpB'), {});
  function draw(anim) {
    const f = frames[i], p = f.pos, chk = CE.inCheck(p, p.side) ? p.k[p.side] : -1;
    RB.set({ pos: p, persp: pv, view: ST.view, set: ST.set, board: ST.board, coords: false, last: f.last, check: chk, sel: -1, targets: null, hint: null, fallen: i === frames.length - 1 && r.why === 'mate' ? p.k[p.side] : -1 });
    $('#rpM').innerHTML = (i ? iso(esc(Math.ceil(i / 2) + (i % 2 ? '. ' : '… ') + f.san)) : esc(T('startPos'))) + ' · ' + iso(i + ' / ' + (frames.length - 1)) + (i === frames.length - 1 ? ' · ' + esc(whyText(r.why)) : '');
    if (anim && f.last) { const prev = frames[i - 1].pos, x = prev.b[f.last.from], y = prev.b[f.last.to]; RB.animate({ from: f.last.from, to: f.last.to, type: x & 7, color: x >> 3, cap: y ? { sq: f.last.to, type: y & 7, color: y >> 3 } : null, rook: null, promo: (p.b[f.last.to] & 7) !== (x & 7) ? p.b[f.last.to] & 7 : 0, style: 'quick' }); }
  }
  o.addEventListener('click', e => {
    const k = e.target.closest('[data-k]'); if (!k) return; const v = k.dataset.k;
    if (v === 'x') { clearInterval(auto); closeOv(o); return; }
    if (v === 'p') { if (auto) { clearInterval(auto); auto = null; k.textContent = '▶'; } else { k.textContent = '⏸'; auto = setInterval(() => { if (i < frames.length - 1) { i++; draw(true); } else { clearInterval(auto); auto = null; k.textContent = '▶'; } }, 900); } return; }
    const ni = v === '0' ? 0 : v === '9' ? frames.length - 1 : Math.max(0, Math.min(frames.length - 1, i + +v)); const step = ni === i + 1; i = ni; draw(step);
  });
  setTimeout(() => draw(false), 30);
}

/* =====================================================================
   ChessNest — online for two (NestLink 1.1 with heartbeat)
   The host (seat 0) holds the game. After every change it sends the friend a full snapshot
   (start + moves + clock + offers): chess has no hidden information, and a full snapshot means
   every message re-syncs. The friend sends intents (move / offers / answers / resign / rematch);
   the host checks and applies them. Only the host's clock decides a flag; while the friend is
   offline the host pauses the clock.
   ===================================================================== */
let LINK = null;
function initLink() {

    app: 'chessnest', version: APP_VERSION, maxPlayers: 2,
    name: () => ST.name || T('player'),

    onStatus: () => { renderNet(); if (SCREEN === 'lobby') renderLobby(); },
    onJoin: () => { if (!isHostOnline()) return; sendCfg(); if (G.started) netBroadcast(); },
    onRoster: () => {
      if (isHostOnline()) {
        const n = nameAt(1); if (n) { if (G.started) G.names[G.wseat === 1 ? 0 : 1] = n; }
        if (G.started && !G.result) clockPause(!rosterOnline(1));

    },
    onMessage: (m, from) => netMsg(m, from),
    onEmoji: (e, from) => bubble(from, e),
    onTalk: (ls, on) => { if (ls !== LINK.seat && on) toast('🎙 ' + (nameAt(ls) || T('friend')) + ' ' + T('talking'), 1500); },
    onVoiceMsg: (url, sec, ls, mine) => voiceMsg(url, sec, ls, mine),
    onRecState: on => { const b = $('#vRec'); if (b) { b.classList.toggle('on', on); b.textContent = on ? '⏹ ' + T('stop') : '⏺'; } },
    onMicError: () => toast(T('micDenied'), 4000),

    onCode: () => { if (SCREEN === 'lobby') renderLobby(); }
  });
}

function sendCfg() { if (isHostOnline() && LINK.roster.some(p => p.seat === 1)) LINK.sendTo(1, { type: 'lobby', cfg: G.cfg }); }

/* ---------- host: run the game ---------- */
function netStart() {
  if (!isHostOnline() || !rosterOnline(1)) return;
  const c = G.cfg.color === 'r' ? (Math.random() < .5 ? 'w' : 'b') : G.cfg.color;
  netBegin(c === 'w' ? 0 : 1);
}
function netBegin(wseat) {
  const me = ST.name || T('player'), fr = nameAt(1) || T('friend');
  Object.assign(G, { id: Date.now(), fen0: CE.START, moves: [], sans: [], result: null, why: '', wseat, names: wseat === 0 ? [me, fr] : [fr, me], clock: clockOf(G.cfg.clock), undos: [0, 0], counted: false, shown: false, started: true, offer: null, offerNo: null });
  rebuild(); closeAllOv(); beep('start'); show('game'); afterChange(null);
  if (myColor() === 1) toast(T('youPlayBlack'));
}
function netNewGame() { if (!isHostOnline()) return; netBegin(G.wseat ^ 1); }        // a rematch swaps colours
function snapshot() {
  const C = G.clock ? Object.assign({}, G.clock, { left: [clockLeft(0), clockLeft(1)] }) : null;
  return { id: G.id, fen0: G.fen0, moves: G.moves, sans: G.sans, result: G.result, why: G.why, wseat: G.wseat, names: G.names, clock: C, undos: G.undos, offer: G.offer || null, offerNo: G.offerNo || null, started: G.started };
}
function netBroadcast() {
  if (!isHostOnline() || !G.started || !LINK || !LINK.session) return;
  if (!LINK.roster.some(p => p.seat === 1)) return;
  LINK.sendTo(1, { type: 'view', g: snapshot() });
  // only the newest snapshot matters — blank the older ones (session stays small, numbering intact)
  const lk = LINK.session.links && LINK.session.links[1];
  if (lk && lk.out) { let seen = false; for (let i = lk.out.length - 1; i >= 0; i--) { const d = lk.out[i].d; if (d && d.type === 'view') { if (seen) lk.out[i].d = { type: 'x' }; seen = true; } } }
}
// offers (undo / draw) — whoever asks, the other side answers
function netOffer(kind) {
  if (!G || G.result || G.offer) return;
  if (kind === 'undo' && !G.moves.length) return;
  if (isGuest()) { LINK.sendTo(0, { type: 'offer', kind }); G.offer = { kind, by: myColor(), id: Date.now() }; renderGame(); toast(T('offerSent')); return; }
  G.offer = { kind, by: myColor(), id: Date.now() }; saveGame(); netBroadcast(); renderGame(); toast(T('offerSent'));
}
function hostAnswer(yes) {
  const o = G.offer; if (!o) return;
  G.offer = null;
  if (yes && o.kind === 'draw') { endGame('1/2-1/2', 'agreed'); afterChange(null); return; }
  if (yes && o.kind === 'undo') {
    // take back until it is the asker's turn again
    let n = turn() === o.by ? 2 : 1; n = Math.min(n, G.moves.length);
    if (n > 0) { G.moves.splice(-n); G.sans.splice(-n); G.undos[o.by]++; rebuild(); }
    if (G.result) { G.result = null; G.why = ''; G.shown = false; }
    BOARD && BOARD.finish(); beep('move'); afterChange(null); return;
  }
  G.offerNo = { kind: o.kind, by: o.by, id: o.id }; saveGame(); netBroadcast(); renderGame();
  if (o.by === myColor()) toast(T('offerNo'));
}
let ASKED = 0;
function askAnswer() {
  const o = G && G.offer; if (!o || o.by === myColor() || ASKED === o.id) return;
  ASKED = o.id;
  confirmBox(o.kind === 'draw' ? T('drawQ', nameOf(o.by)) : T('undoQ', nameOf(o.by)), T('yesAllow'), () => answer(true), T('noThanks'), () => answer(false));
}
function answer(yes) { if (isGuest()) { LINK.sendTo(0, { type: 'ans', yes }); G.offer = null; renderGame(); } else hostAnswer(yes); }
function netMsg(m, from) {
  if (!G || !isOnline() || !m) return;
  if (isHostOnline()) {
    if (from !== 1) return;
    const gc = G.wseat === 1 ? 0 : 1;                           // the guest's colour
    if (m.type === 'move') {
      if (!G.started || G.result || turn() !== gc || m.n !== G.moves.length || G.offer) { netBroadcast(); return; }
      const info = applyMove(m.uci); if (!info) { netBroadcast(); return; }
      beep('turn'); buzz(20); afterChange(info);
    } else if (m.type === 'offer') { if (!G.offer && !G.result) { G.offer = { kind: m.kind, by: gc, id: Date.now() }; saveGame(); netBroadcast(); renderGame(); askAnswer(); } else netBroadcast(); }
    else if (m.type === 'ans') { if (G.offer && G.offer.by !== gc) hostAnswer(!!m.yes); }
    else if (m.type === 'resign') { if (!G.result && G.started) { endGame(gc ? '1-0' : '0-1', 'resign'); afterChange(null); } }
    else if (m.type === 'rematch') { if (G.result) confirmBox(T('rematchQ', nameAt(1) || T('friend')), T('playAgain'), netNewGame); }
    else if (m.type === 'hello') netBroadcast();
    return;
  }
  // guest
  if (m.type === 'lobby') { G.cfg = m.cfg; saveGame(); if (SCREEN === 'lobby') renderLobby(); return; }
  if (m.type === 'view') {
    const g = m.g, newGame = g.id !== G.id || !G.started;
    let info = null;
    if (newGame) { closeAllOv(); ASKED = 0; G.counted = false; G.shown = false; SEL = -1; HINT = null; BOARD && BOARD.finish(); }
    const same = !newGame && g.moves.length >= G.moves.length && G.moves.every((u, i) => g.moves[i] === u);
    if (same && g.moves.length === G.moves.length + 1) { info = applyMove(g.moves[g.moves.length - 1]); if (info) { beep('turn'); buzz(20); } }
    if (!info && (newGame || !same || g.moves.length !== G.moves.length)) { G.moves = g.moves.slice(); G.sans = g.sans.slice(); rebuild(); }
    const wasResult = G.result;
    Object.assign(G, { id: g.id, fen0: g.fen0, sans: g.sans.slice(), wseat: g.wseat, names: g.names, undos: g.undos, offer: g.offer, started: g.started });
    if (g.clock) { G.clock = Object.assign({}, g.clock, { t0: Date.now() }); } else G.clock = null;
    if (g.offerNo && (!G.offerNo || G.offerNo.id !== g.offerNo.id)) { if (g.offerNo.by === myColor()) toast(T('offerNo')); }
    G.offerNo = g.offerNo;
    if (g.result && !wasResult) { endGame(g.result, g.why); }
    else if (!g.result && wasResult) { G.result = null; G.why = ''; G.shown = false; G.counted = false; }
    saveGame();
    if (SCREEN === 'lobby' || newGame) show('game');
    afterChange(info);
    askAnswer();
  }
}

  confirmBox(T('leaveQ'), T('leaveRoom'), () => { LINK.close(); clearTimers(); G = null; saveGame(); closeAllOv(); show('home'); renderHome(); });

  const E = ['👍', '😂', '😮', '😎', '🔥', '👏', '😬', '🙈'], PH = ['phNice', 'phHurry', 'phOops', 'phWow', 'phAgain', 'phGG'];
  const o = overlay('<div class="emogrid">' + E.map(e => '<button data-e="' + e + '">' + e + '</button>').join('') + '</div><div class="phr">' + PH.map(k => '<button data-e="' + esc(T(k)) + '">' + esc(T(k)) + '</button>').join('') + '</div><div class="row" style="margin-top:10px"><button class="btn" data-c>' + esc(T('close')) + '</button></div>');
  o.addEventListener('click', e => { const b = e.target.closest('[data-e]'); if (b) { sendEmo(b.dataset.e); closeOv(o); } else if (e.target.closest('[data-c]')) closeOv(o); });
}
function voiceMsg(url, sec, seat, mine) {
  const L = $('#bubbles'); if (!L) return;
  const a = new Audio(url); if (!mine) { const p = a.play(); if (p && p.catch) p.catch(() => toast(T('tapToHear'))); }
  const anchor = anchorFor(seat); if (!anchor) return;
  const r = anchor.getBoundingClientRect(), b = document.createElement('div'); b.className = 'bub'; b.style.pointerEvents = 'auto';
  b.innerHTML = '<small>' + esc(nameAt(seat) || '') + '</small><span class="vmsg"><button class="btn" style="min-height:36px;padding:4px 10px">▶</button> 🎤 ' + iso(sec.toFixed(1) + 's') + '</span>';
  b.querySelector('button').onclick = () => { a.currentTime = 0; a.play(); };
  L.appendChild(b); b.style.left = Math.max(8, Math.min(innerWidth - b.offsetWidth - 8, r.left + 10)) + 'px'; b.style.top = Math.max(8, mine ? r.top - b.offsetHeight - 6 : r.bottom + 4) + 'px';
  setTimeout(() => b.remove(), 15000);
}
function bindVoice() {
  const p = $('#vPtt');
  const on = e => { e.preventDefault(); p.classList.add('on'); LINK.talk(true); }, off = () => { if (!p.classList.contains('on')) return; p.classList.remove('on'); LINK.talk(false); };
  p.addEventListener('pointerdown', on); p.addEventListener('pointerup', off); p.addEventListener('pointerleave', off); p.addEventListener('pointercancel', off);
  p.oncontextmenu = e => e.preventDefault();
  $('#vOpen').onclick = async () => { const want = !LINK.openMic; await LINK.setOpenMic(want); $('#vOpen').classList.toggle('on', LINK.openMic); toast(LINK.openMic ? T('openMicOn') : T('openMicOff')); };
  $('#vRec').onclick = () => { if (LINK.recording) LINK.recStop(); else LINK.recStart(20); };
  $('#vEmo').onclick = emoPanel;
}

function renderHome() {

/* ---------- setup: vs computer / one phone ---------- */
function setupBox(mode) {
  let level = ST.level, color = ST.color, clock = ST.clock, names = LS.get('names', [ST.name || T('player') + ' 1', T('player') + ' 2']);
  const o = overlay('<div id="suB"></div>');
  function draw() {
    let h = '<h3>' + esc(mode === 'cpu' ? T('vsCpu') : T('twoPhone')) + '</h3>';
    if (mode === 'cpu') {
      h += '<label class="f">' + esc(T('chooseLevel')) + '</label><div class="lvls">' + [1, 2, 3, 4, 5].map(i => '<button class="btn lvb ' + (level === i ? 'main' : '') + '" data-l="' + i + '"><i>' + LVL_IC[i] + '</i>' + esc(T('lv' + i)) + '</button>').join('') + '</div><p class="sub">' + esc(T('lvSub' + level)) + '</p>';
      h += '<label class="f">' + esc(T('youPlay')) + '</label>' + segS('color', colorOpts(), color);
    } else h += [0, 1].map(i => '<label class="f" for="nm' + i + '">' + (i ? '♚ ' : '♔ ') + esc(T(i ? 'black' : 'white')) + '</label><input class="in" id="nm' + i + '" data-nm="' + i + '" maxlength="20" value="' + esc(names[i] || '') + '">').join('');
    h += '<label class="f">' + esc(T('clockLbl')) + '</label>' + segS('clock', CLOCKS.map(k => [k, clkLabel(k)]), clock) + '<p class="sub">' + esc(T('clockSub')) + '</p>';
    h += '<div class="row" style="margin-top:14px"><button class="btn ghosty" data-c>' + esc(T('cancel')) + '</button><button class="btn main" data-go>' + esc(T('startGame')) + '</button></div>';
    $('#suB').innerHTML = h;
  }
  const segS = (k, opts, cur) => '<div class="seg" data-sk="' + k + '">' + opts.map(([v, l]) => '<button data-v="' + v + '" class="' + (String(cur) === String(v) ? 'on' : '') + '">' + esc(l) + '</button>').join('') + '</div>';
  const keepNames = () => $$('#suB [data-nm]').forEach(i => names[+i.dataset.nm] = i.value.trim().slice(0, 20));
  o.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    keepNames();
    if (b.dataset.l != null) level = +b.dataset.l;
    else if (b.closest('[data-sk]')) { const k = b.closest('[data-sk]').dataset.sk; if (k === 'color') color = b.dataset.v; else clock = b.dataset.v; }
    else if (b.hasAttribute('data-c')) { closeOv(o); if (G && !G.result && !isOnline() && SCREEN === 'game') clockPause(false); return; }
    else if (b.hasAttribute('data-go')) {
      Object.assign(ST, { level, color, clock }); saveST();
      const go = () => {
        closeOv(o);
        if (isOnline()) { LINK.close(); }
        const nm = [0, 1].map(i => names[i] || T(i ? 'black' : 'white'));
        if (mode === 'cpu') startCpu(level, color, clock); else { LS.set('names', nm); startTwo(nm, clock); }
      };
      if (G && !G.result && G.moves.length && !isOnline()) confirmBox(T('replaceQ'), T('newGame'), go);
      else if (isOnline()) confirmBox(T('leaveRoomFirst'), T('leaveRoom'), go);
      else go();
      return;
    }
    draw();
  });
  draw();
}

/* ---------- settings ---------- */

function seg(k, opts) { return '<div class="seg" data-seg="' + k + '">' + opts.map(([v, l]) => '<button data-v="' + v + '" class="' + (String(ST[k]) === String(v) ? 'on' : '') + '">' + esc(l) + '</button>').join('') + '</div>'; }

    '<label class="f">' + esc(T('dayNight')) + '</label>' + seg('mode', [['night', '🌙 ' + T('night')], ['day', '☀️ ' + T('day')]]) + '</div>' +
    '<div class="card"><h3>' + esc(T('playLbl')) + '</h3>' + sw('showMoves', T('showMoves'), T('showMovesSub')) + sw('coords', T('coordsLbl')) + sw('flip', T('flipLbl'), T('flipSub')) + sw('sound', T('sound')) + sw('vib', T('vibration')) + '</div>' +

    '<div class="row"><button class="btn ghosty" id="sTour">🧭 ' + esc(T('tourAgain')) + '</button><button class="btn ghosty" id="sReset" style="color:var(--bad);border-color:var(--bad)">🗑️ ' + esc(T('deleteAll')) + '</button></div></div>' +
    '<div class="badge">ChessNest v' + APP_VERSION + ' · © AppNest 2026</div>';
  $('#sName').onchange = e => { ST.name = e.target.value.trim().slice(0, 20); saveST(); };
  $('#sLang').onchange = e => { ST.lang = e.target.value; saveST(); applyLang(); renderSettings(); renderHome(); };
  $('#sLook').onclick = e => { if (lookClick(e)) renderSettings(); };
  $$('#setBody [data-theme-pick]').forEach(x => x.onclick = () => { ST.theme = x.dataset.themePick; saveST(); applyLook(); renderSettings(); });
  $$('#setBody [data-seg]').forEach(sg => sg.onclick = e => { const v = e.target.closest('[data-v]'); if (!v) return; ST[sg.dataset.seg] = v.dataset.v; saveST(); applyLook(); renderSettings(); });
  $$('#setBody .sw').forEach(x => { const f = () => { ST[x.dataset.k] = !ST[x.dataset.k]; saveST(); applyLook(); renderSettings(); }; x.onclick = f; x.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
  $('#sBackup').onclick = backup;
  $('#sRestore').onchange = e => { if (e.target.files[0]) restore(e.target.files[0]); };
  $('#sTour').onclick = () => tour(true);
  $('#sReset').onclick = () => confirmBox(T('deleteAllQ'), T('deleteAll'), () => confirmBox(T('deleteAllQ2'), T('deleteAll'), () => { try { LINK && LINK.close(); } catch (e) {} LS.keys().forEach(k => LS.del(k)); location.href = location.pathname; }));
}

/* ---------- stats ---------- */
function renderStats() {
  const S = LS.get('stats', {}); let h = '';
  const pct = (a, n) => n ? Math.round(a / n * 100) + '%' : '–';
  for (const k of ['cpu1', 'cpu2', 'cpu3', 'cpu4', 'cpu5', 'two', 'online']) {
    const b = S[k]; if (!b || !b.g) continue;
    const lab = k.startsWith('cpu') ? LVL_IC[+k[3]] + ' ' + T('vsCpu') + ' · ' + T('lv' + k[3]) : k === 'two' ? T('twoPhone') : T('online');
    h += '<div class="card"><h3>' + esc(lab) + '</h3><table class="tbl">' +
      (k === 'two' ? '<tr><td>' + esc(T('gamesPlayed')) + '</td><td>' + num(b.g) + '</td><td></td></tr><tr><td>' + esc(T('draws')) + '</td><td>' + num(b.d) + '</td><td></td></tr>'
        : '<tr><th></th><th>' + esc(T('wins')) + '</th><th>' + esc(T('draws')) + '</th><th>' + esc(T('losses')) + '</th></tr><tr><td>' + iso(NF(b.g)) + ' ' + esc(T('gamesPlayed')) + '</td><td>' + num(b.w) + '</td><td>' + num(b.d) + '</td><td>' + num(b.l) + '</td></tr><tr><td>' + esc(T('winRate')) + '</td><td colspan="3">' + pct(b.w + b.d / 2, b.g) + '</td></tr>' + (b.mates ? '<tr><td>' + esc(T('matesGiven')) + '</td><td colspan="3">' + num(b.mates) + '</td></tr>' : '')) + '</table></div>';
  }
  $('#statBody').innerHTML = h || '<div class="card"><p>' + esc(T('noStats')) + '</p><button class="btn main" id="stPlay" style="width:100%">' + esc(T('vsCpu')) + '</button></div>';
  if ($('#stPlay')) $('#stPlay').onclick = () => setupBox('cpu');
}
function renderReplays() {
  const R = LS.get('replays', []);
  if (!R.length) { $('#repBody').innerHTML = '<div class="card"><p>' + esc(T('noReplays')) + '</p></div>'; return; }
  $('#repBody').innerHTML = R.map((r, i) => '<button class="card" data-i="' + i + '" style="width:100%;text-align:start;cursor:pointer;display:block;color:var(--ink)"><b>♔ ' + esc(r.names[0]) + ' — ♚ ' + esc(r.names[1]) + '</b><div class="muted">' + esc(new Date(r.d).toLocaleString(ST.lang)) + ' · ' + esc(r.mode === 'cpu' ? T('lv' + r.lvl) : r.mode === 'two' ? T('twoPhone') : T('online')) + '</div><div>' + iso(r.result) + ' · ' + esc(T('why_' + r.why)) + ' · ' + esc(T('moveN', Math.ceil(r.moves.length / 2))) + '</div></button>').join('');
  $$('#repBody [data-i]').forEach(b => b.onclick = () => playReplay(R[+b.dataset.i]));
}

  $('#aTour').onclick = () => tour(true);

/* ---------- first-run tour ---------- */
function tour(force) {
  if (!force && ST.tutDone) return;
  const steps = [['⚔️', 'tour1t', 'tour1'], ['👆', 'tour2t', 'tour2'], ['🎥', 'tour3t', 'tour3'], ['🤖', 'tour4t', 'tour4'], ['🌍', 'tour5t', 'tour5']];
  let i = 0;
  const o = overlay('<div class="tut" id="tutB"></div>', 'center'); o.dataset.lock = '1';
  function draw() {
    const [ic, t, b] = steps[i];
    $('#tutB').innerHTML = '<div class="big">' + ic + '</div><h3>' + esc(T(t)) + '</h3><p>' + esc(T(b)) + '</p><div class="dots">' + steps.map((_, j) => '<i class="' + (j === i ? 'on' : '') + '"></i>').join('') + '</div><div class="row"><button class="btn ghosty" data-k="skip">' + esc(T('skip')) + '</button><button class="btn main" data-k="next">' + esc(i === steps.length - 1 ? T('letsPlay') : T('next')) + '</button></div>';
  }
  o.addEventListener('click', e => { const k = e.target.closest('[data-k]'); if (!k) return; if (k.dataset.k === 'next' && i < steps.length - 1) { i++; draw(); return; } ST.tutDone = true; saveST(); closeOv(o); });
  draw();
}

/* ---------- init ---------- */
function init() {
  applyLook(); applyLang(); initLink(); bindGame(); bindVoice();
  $$('[data-home]').forEach(b => b.onclick = () => {
    if (b.closest('#rules') && RULES_BACK !== 'home') { const t = RULES_BACK; RULES_BACK = 'home'; show(t); return; }
    if (b.closest('#lobby') && isOnline() && !G.started) { netLeave(); return; }
    show('home'); renderHome();
  });
  $('#hTheme').onclick = () => { ST.theme = THEMES[(THEMES.indexOf(ST.theme) + 1) % THEMES.length]; saveST(); applyLook(); toast('🎨 ' + T('theme')); };
  $('#hMode').onclick = () => { ST.mode = ST.mode === 'day' ? 'night' : 'day'; saveST(); applyLook(); };
  $('#hLang').onclick = () => { const ks = Object.keys(LANGS); ST.lang = ks[(ks.indexOf(ST.lang) + 1) % ks.length]; saveST(); renderHome(); toast(LANGS[ST.lang]); };
  $('#hAbout').onclick = () => { renderAbout(); show('about'); };
  $('#hRules').onclick = () => { renderRules(); RULES_BACK = 'home'; show('rules'); };
  $('#hStats').onclick = () => { renderStats(); show('stats'); };
  $('#hReplays').onclick = () => { renderReplays(); show('replays'); };
  $('#hSettings').onclick = () => { renderSettings(); show('settings'); };
  $('#mCpu').onclick = () => setupBox('cpu');
  $('#mTwo').onclick = () => setupBox('two');
  $('#mOnline').onclick = () => { if (isOnline()) { show(G.started ? 'game' : 'lobby'); if (!G.started) renderLobby(); } else openOnline(); };
  $('#mCont').onclick = () => {
    if (!G) return;
    if (isOnline()) { show(G.started ? 'game' : 'lobby'); if (!G.started) renderLobby(); return; }
    show('game'); clockPause(false); afterChange(null);
  };
  // a saved game from an incompatible build is dropped gently
  if (G && G.v !== 1) { G = null; saveGame(); }
  if (G) rebuild();
  if (G && G.clock && !isOnline()) { G.clock.paused = true; }              // time while the app was closed does not count
  if (G && isOnline() && G.net && G.net.sess) { LINK.resume(G.net.sess); if (isGuest() && G.started) setTimeout(() => LINK.isOpen() && LINK.sendTo(0, { type: 'hello' }), 1500); }
  else if (G && isOnline()) { G = null; saveGame(); }
  const q = new URLSearchParams(location.search), jc = q.get('join');
  renderHome();
  if (jc) {
    const q2 = new URLSearchParams(location.search); q2.delete('join'); history.replaceState(null, '', location.pathname + (q2.toString() ? '?' + q2 : ''));
    if (isOnline() && LINK.session && LINK.session.code === jc.toUpperCase()) show(G.started ? 'game' : 'lobby');
    else if (isOnline()) { toast(T('alreadyInRoom')); show('lobby'); renderLobby(); }
    else { if (!ST.name) { show('lobby'); renderLobby(); $('#lCode').value = jc.toUpperCase(); toast(T('enterNameJoin'), 4000); } else openOnline(jc); }
  } else if (isOnline()) { show(G.started ? 'game' : 'lobby'); if (!G.started) renderLobby(); else afterChange(null); }
  else tour(false);
  if (location.protocol === 'file:') toast(T('fileWarn'), 6000);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !q.get('nosw')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', init);
